allowBuilds:
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true
# Overrides de seguridad (pnpm v11 lee la config desde aquí, ya no del campo "pnpm" de package.json).
# Fuerzan versiones parcheadas en dependencias transitivas reportadas por Dependabot:
#   - lodash <4.18.0  llega vía recharts  -> CVE corregido en 4.18.0
#   - postcss <8.5.10 llega vía next / @tailwindcss/postcss / autoprefixer
overrides:
  lodash: ^4.18.1
  postcss: ^8.5.15
